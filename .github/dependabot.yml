version: 2
updates:
  # Gradle plugins and libraries, via gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
