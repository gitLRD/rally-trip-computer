name: Release

# Pushing a v* tag publishes a GitHub release with a signed APK attached.
#
# The whole CI suite runs first: a release that fails its own tests should never
# reach anyone's phone, and a rally is not the place to discover a regression.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches the version in the build file
        id: version
        run: |
          version_name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          version_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if [ "v$version_name" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName $version_name in app/build.gradle.kts." >&2
            echo "Bump the version in the build file, or retag, so the two agree." >&2
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Screenshot tests
        run: ./gradlew verifyRoborazziDebug

      - name: Lint
        run: ./gradlew lintDebug

      # Written outside the workspace so it cannot be picked up by anything that
      # archives the build directory.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not set. See RELEASING.md for how to create" >&2
            echo "the keystore and add the four repository secrets." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble the release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Confirm the APK is actually signed
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Name the APK after the version
        id: apk
        run: |
          name="gps-trip-computer-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The same notes F-Droid shows, so the two never drift apart.
      - name: Collect the release notes
        run: |
          changelog="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt"
          if [ -f "$changelog" ]; then
            cat "$changelog" > NOTES.md
          else
            echo "No changelog was written for version code ${{ steps.version.outputs.code }}." > NOTES.md
          fi
          {
            echo
            echo "---"
            echo
            echo "Verify the download before installing:"
            echo
            echo '```'
            cat "${{ steps.apk.outputs.name }}.sha256"
            echo '```'
          } >> NOTES.md

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file NOTES.md \
            "${{ steps.apk.outputs.name }}" \
            "${{ steps.apk.outputs.name }}.sha256"
