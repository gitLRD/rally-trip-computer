name: CI

on:
  # Every branch, not just main: this is a solo repo where work is often merged
  # straight to main, so a branch that has never been checked is no use. Dependabot
  # branches are excluded because their pull_request event already covers them, and
  # running both doubles the emulator jobs for nothing.
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Screenshot tests
        run: ./gradlew verifyRoborazziDebug

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # minSdk, where LocationListener's callbacks have no default implementations —
          # dropping those overrides would throw AbstractMethodError only on this end.
          - api-level: 24
            target: default
          # targetSdk.
          - api-level: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration to be usable on a runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
